<div class="cc-app">
  <form id="cc-form" class="cc-form">
    <label class="sr-only" for="cc-zip">ZIP code</label>
    <input id="cc-zip" class="form-control" inputmode="numeric" autocomplete="postal-code"
           pattern="[0-9]{5}" maxlength="5" placeholder="ZIP code">
    <button type="submit" class="btn btn-primary">Find my officials</button>
  </form>
  <ul id="cc-results" class="cc-results" aria-live="polite"></ul>
</div>
