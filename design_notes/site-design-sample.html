/* ---- Theme layer: Beautiful Jekyll (MIT), reduced, with the site's _config.yml colours ---- */


:root {
  /* config file CSS variables */
  --page-col: #FFFFFF;
  --text-col: #404040;
  --link-col: #008AFF;
  --hover-col: #0085A1;
  --navbar-col: #EAEAEA;
  --navbar-text-col: #404040;
  --navbar-border-col: #DDDDDD;
  --footer-col: #EAEAEA;
  --footer-text-col: #777777;
  --footer-link-col: #404040;
  --footer-hover-col: #0085A1;

  /* common CSS variables */
  --body-font: 'Lora', 'Times New Roman', serif;
  --header-font: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --mid-col: #808080;
}

/* --- General --- */

html {
  font-size: 100%
}

body {
  font-family: var(--body-font);
  font-size: 1.125rem;
  color: var(--text-col);
  position: relative;
  background-color: var(--page-col);
  background-attachment: fixed;
  overflow-wrap: break-word;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
body > main {
  flex: 1;
}
p {
  line-height: 1.5;
  margin: 1.875rem 0;
}
h1 {
  font-family: var(--header-font);
  font-weight: 800;
  line-height: 1.1;
}
h1 {
  font-size: 2.25rem;
}
h1 {
  margin-top: 1.25rem;
}
a {
  color: var(--link-col);
}
a:hover,
a:focus {
  color: var(--hover-col);
}
hr.small {
  max-width: 6.25rem;
  margin: 1rem auto;
  border-width: 0.25rem;
  border-color: inherit;
  border-radius: 0.1875rem;
}

/* fix in-page anchors to not be behind fixed header */
:target:before {
  content: "";
  display: block;
  height: 3.125rem; /* navbar height */
  margin: -3.125rem 0 0;
}

::-moz-selection {
  color: var(--page-col);
  background-color: var(--hover-col);
  text-shadow: none;
}
::selection {
  color: var(--page-col);
  background-color: var(--hover-col);
  text-shadow: none;
}

/* --- Post and page headers --- */

.intro-header {
  margin: 5rem 0 1.25rem;
  position: relative;
}
.intro-header .page-heading {
  text-align: center;
}
.intro-header .page-heading h1 {
  margin-top: 0;
  font-size: 3.125rem;
}
.intro-header .page-heading .page-subheading {
  font-size: 1.6875rem;
  line-height: 1.1;
  display: block;
  font-family: var(--header-font);
  font-weight: 300;
  margin: 0.625rem 0 0;
}
@media (min-width: 1200px) {
  .intro-header {
    margin-top: 8.125rem;
  }
  .intro-header .page-heading h1 {
    font-size: 5rem;
  }
}

code {
  padding: 0.125rem 0.25rem;
  color: #c7254e;
  background-color: #f9f2f4;
  border-radius: 0.25rem;
}

/* --- Notification boxes --- */
.box-note,
.box-warning {
  padding: 0.9375rem 0.9375rem 0.9375rem 0.625rem;
  margin: 1.25rem 1.25rem 1.25rem 0.3125rem;
  border: 1px solid #eee;
  border-left-width: 0.3125rem;
  border-radius: 0.3125rem 0.1875rem 0.1875rem 0.3125rem;
}

.box-note {
  background-color: #eee;
  border-left-color: #2980b9;
}

.box-warning {
  background-color: #fdf5d4;
  border-left-color: #f1c40f;
}

/* ---- App layer ---- */
/* Shared app layer (congress.css): .cc-* rules and --cc-* tokens only.
   Scoped to .cc-app so it never recolours the theme's navbar, links or footer. */
.cc-app {
  --cc-accent: #0066CC;        /* 5.57:1 with white; same blue family as the theme */
  --cc-accent-hover: #005A9E;  /* 7.10:1 */
  --cc-control-border: #8A8A8A;/* 3.45:1 against white (non-text 3:1) */
  --cc-focus: #0066CC;         /* solid focus outline, 5.57:1 */
  --cc-rule: #DDDDDD;          /* decorative divider, same as theme navbar border */
  --cc-gap: 0.75rem;
}
.cc-app .btn-primary { background-color: var(--cc-accent); border-color: var(--cc-accent); color: #FFFFFF; }
.cc-app .btn-primary:hover { background-color: var(--cc-accent-hover); border-color: var(--cc-accent-hover); color: #FFFFFF; }
.cc-app .btn:focus, .cc-app .btn:focus-visible,
.cc-app .form-control:focus { outline: 3px solid var(--cc-focus); outline-offset: 2px; box-shadow: none; }
.cc-app .form-control { border-color: var(--cc-control-border); }
.cc-app .btn { font-family: var(--header-font); font-weight: 600; min-height: 44px; }
.cc-form { display: flex; gap: var(--cc-gap); margin-bottom: var(--cc-gap); }
.cc-form .form-control { max-width: 9rem; min-height: 44px; font-size: 1.125rem; }
.cc-results { list-style: none; padding: 0; margin: 0; }
.cc-official { padding: var(--cc-gap) 0; border-bottom: 1px solid var(--cc-rule); }
.cc-official-name { display: block; font-family: var(--header-font); font-weight: 700; }
.cc-official-role { display: block; margin-bottom: 0.5rem; }
</style></head>

<header class="header-section"><div class="intro-header no-img"><div class="container-md"><div class="row"><div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1"><div class="page-heading">
<h1>Contact Your Congress</h1><hr class="small"><span class="page-subheading">Save your senators and representative to your phone</span>
</div></div></div></div></div></header>
<main class="container-md"><div class="row"><div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
<div class="cc-app">
  <form id="cc-form" class="cc-form" onsubmit="return false">
    <label class="sr-only" for="cc-zip">ZIP code</label>
    <input id="cc-zip" class="form-control" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}" maxlength="5" placeholder="ZIP code">
    <button type="submit" class="btn btn-primary">Find my officials</button>
  </form>
  <ul id="cc-results" class="cc-results" aria-live="polite">
    <li class="cc-official"><span class="cc-official-name">Sample Representative</span><span class="cc-official-role">Representative, MA-1</span><a class="btn btn-primary cc-save" href="#">Save contact</a></li>
    <li class="cc-official"><span class="cc-official-name">Sample Senator One</span><span class="cc-official-role">Senator, MA</span><a class="btn btn-primary cc-save" href="#">Save contact</a></li>
  </ul>
  <div class="box-note">Not sure which district you are in? Use the official House lookup.</div>
</div>
</div></div></main>
